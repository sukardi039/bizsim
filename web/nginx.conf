server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset names: safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Server-sent events must not be buffered anywhere on the way, and the connection stays open
    # between rounds, so both buffering and the read timeout have to be turned off explicitly.
    location ~ ^/api/runs/[0-9]+/events$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Plain-text probe. If this 404s through the domain, the request never reached nginx — it is a
    # routing problem in Dokploy, not an application problem.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "web ok\n";
    }

    # Single page app: anything else is the console.
    #
    # index.html must never be cached by the browser: it is the only file that names the hashed
    # bundle, so a cached copy keeps serving the previous deploy's JavaScript while the API is new.
    # That is exactly how "the update is live but the screens look old" happens -- the API reported a
    # fresh build while the console still had no role selector.
    location / {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
        try_files $uri $uri/ /index.html;
    }

    # Belt and braces for the document itself.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }
}
