# Deployment compose for Dokploy: three containers, no host ports, TLS and routing at the proxy.
#
#   web  nginx :80   static console + /api proxy  <-- attach the domain here
#   api  java  :8080 Spring Boot
#   db   postgres    internal only
#
# Secrets are not in this file. Dokploy's Environment tab produces the .env that all three read,
# so nothing credential-shaped is tracked. See docs/DEPLOYMENT.md for the keys to set.

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - bizsim-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BIZSIM_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bizsim}
      BIZSIM_DB_CREATE: "false"      # PostgreSQL created it from POSTGRES_DB
      BIZSIM_PORT: "8080"
      # Only needed when the browser talks to the API directly instead of through nginx.
      BIZSIM_CORS_ORIGINS: ${BIZSIM_CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Empty means "call /api on my own origin", which is what nginx proxies. Set it only for a
        # split deployment, and then also set BIZSIM_CORS_ORIGINS on the api service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - api
    expose:
      - "80"
    # Dokploy's Traefik can only route to containers that are on its network. Without this line the
    # domain answers "404 page not found" in plain text, which is Traefik, not nginx.
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

volumes:
  bizsim-db:
