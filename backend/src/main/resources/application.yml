server:
  port: ${BIZSIM_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: bizsim
  datasource:
    url: ${BIZSIM_DB_URL:jdbc:postgresql://localhost:5433/bizsim}
    username: ${BIZSIM_DB_USER:bizsim}
    password: ${BIZSIM_DB_PASSWORD:bizsim}
    hikari:
      maximum-pool-size: ${BIZSIM_DB_POOL:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail the boot if an applied migration no longer matches its checksum. That error is the only
    # thing standing between "the file says one thing" and "production already ran another".
    validate-on-migrate: true
    # Two branches both adding V5 must be resolved before merge, not applied in arrival order.
    out-of-order: false
    # `clean` drops every table. It must never be reachable from an application startup.
    clean-disabled: true
    # Attaching an existing database is a deliberate act (docs/MIGRATIONS.md), never implicit.
    baseline-on-migrate: false
    # Five instances starting at once: one migrates, the others wait instead of failing.
    lock-retry-count: 60
    # A database still coming up (compose, Kubernetes) gets retries, not a crash loop.
    connect-retries: 10
    connect-retries-interval: 5s
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # A mistyped form field must be a 400, not a silently ignored decision.
      fail-on-unknown-properties: true

bizsim:
  # Reported by GET /api/version. The migration history is the real deploy fingerprint; this string
  # is for humans and should be bumped when a release is cut.
  version: 0.9.5
  db:
    # Create the empty database on first start if it is missing. The schema itself is always
    # Flyway's job (classpath:db/migration). Set false where the app role has no CREATEDB right.
    create-if-missing: ${BIZSIM_DB_CREATE:true}
  jwt:
    # Must be >= 32 bytes. Override everywhere except a developer laptop.
    secret: ${BIZSIM_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: PT8H

logging:
  level:
    com.bizsim: INFO
